name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore portfolio.sln

      - name: Build
        run: dotnet build portfolio.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish portfolio.web/portfolio.web.csproj --configuration Release --no-build --output publish

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-web
          path: publish
          retention-days: 7
